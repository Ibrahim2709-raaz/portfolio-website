<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=devive-width, initial-scale=1.0">
    <title>Contact Me</title></head>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    background: #081b29;
    color: #ededed;
}

.header {
    position: relative;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 10%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
}

.logo {
    font-size: 25px;
    color: #ededed;
    text-decoration: none;
    font-weight: 600;
    cursor: default;
    opacity: 0;
    animation: slideRight 1s ease forwards;
}

/* Hamburger button */
.menu-btn {
  display: none; /* hidden by default */
  font-size: 30px;
  color: #ededed;
  cursor: pointer;
}

.navbar a {
    font-size: 18px;
    color: #ededed;
    text-decoration: none;
    font-weight: 500;
    margin-left: 35px;
    transition: .3s;
    opacity: 0;
    animation: slideTop 0.5s ease forwards;
    animation-delay: calc(.2s * var(--i));
}

.navbar a:hover,
.navbar a.active {
    color: #00afb0;
}

/* Mobile styles */
@media (max-width: 768px) {
  .menu-btn {
    display: block; /* show hamburger on small screens */
  }

  .navbar {
    display: none; /* hide menu by default */
    position: absolute;
    top: 70px;
    right: 10%;
    background: #222;
    flex-direction: column;
    width: 200px;
    padding: 10px;
    border-radius: 8px;
  }

  .navbar.active {
    display: flex; /* show menu when toggled */
  }

  .navbar a {
    margin: 15px 0;
  }
}
@keyframes slideRight {
    0% {
        transform: translateX(-100px);
        opacity: 0;
    }

    100% {
        transform: translateX(0px);
        opacity: 1;
    }
}

@keyframes slideLeft {
    0% {
        transform: translateX(100px);
        opacity: 0;
    }

    100% {
        transform: translateX(0px);
        opacity: 1;
    }
}

@keyframes slideTop {
    0% {
        transform: translateY(100px);
        opacity: 0;
    }

    100% {
        transform: translateY(0px);
        opacity: 1;
    }
}

@keyframes slideBottom {
    0% {
        transform: translateY(-100px);
        opacity: 0;
    }

    100% {
        transform: translateY(0px);
        opacity: 1;
    }
}

.contact-container{
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
}

.contact-left{
    display: flex;
    flex-direction: column;
    align-items: start;
    gap: 20px;
}
    </style>
</head>
<body>
    <header class="header">
        <a href="#" class="logo">Ibrahim.</a>
        <!-- Hamburger button -->
        <div class="menu-btn" id="menu-btn">
          ☰
        </div>
        <nav class="navbar" id="navbar"> 
            <a href="#" style="--i-1;" class="active">Home</a> 
            <a href="About/about.html" style="--i:2;">About</a> 
            <a href="#" style="--i-3;">Projects</a> 
            <a href="#" style="--i-4'">Blah Blah</a> 
            <a href="#" style="--i-5">Contact</a> 
        </nav>
    </header>
    <div class="contact-container">
        <form action="" class="contact-left">
            <div class="contact-left-title">
                <h2>Get in Touch</h2>
                <hr>
                <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
                <input type="text" name="email" placeholder="Your Email" class="contact-inputs" required>
                <textarea name="message" placeholder="Your Message" class="contact-inputs"></textarea>
                <button type="submit">Submit<img src="images/arrow_icon.png"></button>
            </div>
        </form>
    </div>
    <div class="contact-right">
        <img src="images/right_img.png">
    </div>
</body>
</html>
